name: Configuration Demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select target environment'
        required: true
        type: choice
        default: 'DEV'
        options:
          - DEV
          - STAGING
          - PRODUCTION

jobs:
  demonstrate-config:
    name: Run Demo on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application with environment configuration
        env:
          # Non-sensitive configuration from GitHub Actions 'vars' context
          APP_ENV: ${{ vars.APP_ENV }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}

          # Sensitive credentials from GitHub Actions 'secrets' context
          API_TOKEN: ${{ secrets.API_TOKEN }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          python app.py
